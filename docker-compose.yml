services:
  backend:
    build:
      context: ./server
    container_name: quality-inspection-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: quality_tracker_secret
      JWT_EXPIRES_IN: 1d
      PORT: 3000
      SAP_WEBHOOK_URL: http://localhost:3000/sap/inspection
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3000
    container_name: quality-inspection-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped