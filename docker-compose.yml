version: "3.9"

services:
  backend:
    build:
      context: ./server
    container_name: quality-inspection-backend
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3000
    container_name: quality-inspection-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped